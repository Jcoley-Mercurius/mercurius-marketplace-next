name: Analytics privacy

on:
  pull_request:
    paths: ['src/**', 'tests/analytics/**', 'tests/unit/posthog*', 'package*.json', 'playwright.analytics.config.ts', '.github/workflows/analytics.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/analytics/**', 'tests/unit/posthog*', 'package*.json', 'playwright.analytics.config.ts', '.github/workflows/analytics.yml']

permissions:
  contents: read

concurrency:
  group: analytics-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  analytics-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npx vitest run tests/unit/posthog-policy.test.ts tests/unit/posthog-client.test.ts tests/unit/posthog-server.test.ts
      - run: npm run test:analytics
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: analytics-privacy-failure
          path: test-results/
          retention-days: 7
