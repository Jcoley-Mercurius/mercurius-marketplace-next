name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MERCURIUS_BUILD_WORKERS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Pull Supabase images from public.ecr.aws
        # supabase/setup-cli points pulls at ghcr.io, which has refused them with toomanyrequests
        # since 2026-09-23. The same images are published on public.ecr.aws.
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws" >> "$GITHUB_ENV"
      - name: Prepare isolated synthetic stack
        run: node scripts/prepare-phase5-local.mjs
      - name: Reconstruct database
        run: |
          for attempt in 1 2 3; do
            sh scripts/phase5-db.sh start && exit 0
            echo "Isolated start attempt $attempt failed; retrying after a pause."
            supabase stop --workdir .phase5-local --no-backup > /dev/null 2>&1 || true
            sleep 60
          done
          exit 1
      - name: Show redacted start failure
        if: failure()
        run: |
          grep -iE "error|fail|denied|pull|timeout|unhealthy|manifest|exited" .phase5-local/start.log \
            | sed -E 's/eyJ[A-Za-z0-9._-]+/[redacted]/g; s/sb_[a-z]+_[A-Za-z0-9_-]+/[redacted]/g' | tail -40 || true
      - name: Database role and money contracts
        run: sh scripts/phase5-db.sh test
      - name: Concurrent checkout, webhook and refund reservations
        run: node scripts/phase5-concurrency.mjs
      - name: Concurrent lifecycle appeals and ACH preparation
        run: node scripts/phase5-payout-concurrency.mjs
      - name: Concurrent provider invitation dispatch
        run: node scripts/phase5-invitation-concurrency.mjs
      - name: Concurrent onboarding review starts
        run: node scripts/phase5-onboarding-concurrency.mjs
      - name: Concurrent existing-account links
        run: node scripts/phase5-account-link-concurrency.mjs
      - name: Concurrent activation role grants
        run: node scripts/phase5-activation-role-concurrency.mjs
      - name: Concurrent checklist evidence records
        run: node scripts/phase5-checklist-evidence-concurrency.mjs
      - name: Concurrent accepted-invitation bindings
        run: node scripts/phase5-invitation-binding-concurrency.mjs
      - name: Concurrent Auth refusal records
        run: node scripts/phase5-invitation-refusal-concurrency.mjs
      - name: Concurrent renewal document submissions and decisions
        run: node scripts/phase5-renewal-document-concurrency.mjs
      - name: Concurrent renewal document retention steps and holds
        run: node scripts/phase5-renewal-retention-concurrency.mjs
      - name: Concurrent application closures, retention steps and holds
        run: node scripts/phase5-application-retention-concurrency.mjs
      - name: Concurrent finance operator commands
        run: node scripts/phase5-finance-command-concurrency.mjs
      - name: Concurrent finance refund and chargeback commands
        run: node scripts/phase5-finance-refund-concurrency.mjs
      - name: Concurrent ACH batch, bank outcome and retry commands
        run: node scripts/phase5-finance-ach-concurrency.mjs
      - name: Concurrent ACH withdrawal and replacement statements
        run: node scripts/phase5-ach-replacement-concurrency.mjs
      - name: Concurrent payout recoveries and late payments of withdrawn transfers
        run: node scripts/phase5-payout-recovery-concurrency.mjs
      - name: Concurrent bank statement imports, closes and line resolutions
        run: node scripts/phase5-bank-statement-concurrency.mjs
      - name: Concurrent resends and releases of failed refunds
        run: node scripts/phase5-failed-refund-concurrency.mjs
      - name: Concurrent late refund resends, releases, resettlements and repayment reversals
        run: node scripts/phase5-late-reversal-concurrency.mjs
      - name: Clean reset after committed concurrency fixtures
        run: sh scripts/phase5-db.sh reset
      - name: Verify clean replay
        run: sh scripts/phase5-db.sh test
      - name: Locked Edge types
        run: sh scripts/check-edge.sh
      - name: Synthetic Edge handler transport
        run: sh scripts/test-edge.sh
      - name: Stop only this CI test stack
        if: always()
        run: sh scripts/phase5-db.sh stop

  lifecycle:
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Pull Supabase images from public.ecr.aws
        # supabase/setup-cli points pulls at ghcr.io, which has refused them with toomanyrequests
        # since 2026-09-23. The same images are published on public.ecr.aws.
        run: echo "SUPABASE_INTERNAL_IMAGE_REGISTRY=public.ecr.aws" >> "$GITHUB_ENV"
      - name: Locked Edge checks and isolated handler tests
        run: sh scripts/check-edge.sh && sh scripts/test-edge.sh
      - name: Isolated database reconstruction and lifecycle tests
        run: |
          mkdir -p supabase/.audit
          for attempt in 1 2 3; do
            npx supabase start -x studio,imgproxy,mailpit,storage-api,realtime,postgres-meta,logflare,vector,supavisor > supabase/.audit/ci-start.log 2>&1 && break
            [ "$attempt" = 3 ] && { grep -iE "error|toomanyrequests" supabase/.audit/ci-start.log | tail -5; exit 1; }
            echo "Stack start attempt $attempt failed; retrying after a pause."
            npx supabase stop --no-backup > /dev/null 2>&1 || true
            sleep 60
          done
          sh scripts/test-phase4-db.sh
      - name: Authenticated local worker and pg_net transport, Cron inactive
        run: |
          printf '%s\n' 'JOB_LIFECYCLE_ENABLED=true' 'JOB_WORKER_SECRET=synthetic-phase4-worker-only' > supabase/.audit/worker.env
          npx supabase functions serve job-lifecycle-worker --env-file supabase/.audit/worker.env > supabase/.audit/worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          node scripts/test-lifecycle-integration.mjs
          sh scripts/test-inactive-scheduler.sh
      - name: Stop only the isolated CI stack
        if: always()
        run: npx supabase stop --project-id vugqqyemuptlvcieihww

  application:
    needs: lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55831
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mds-synthetic-anon-key
      MERCURIUS_BUILD_WORKERS: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint owned application code
        run: npm run lint

      - name: Scan tracked files for committed credentials
        run: npm run scan:secrets

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Audit production dependencies
        run: |
          for i in {1..3}; do
            npm run audit:prod && break
            if [ $i -lt 3 ]; then
              echo "Audit failed, retrying in $((i * 10)) seconds..."
              sleep $((i * 10))
            else
              exit 1
            fi
          done

      - name: Build
        run: npm run build

      - name: Install accessibility browser
        run: npx playwright install --with-deps chromium

      - name: Component accessibility and keyboard tests
        run: npm run test:a11y

      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-evidence
          path: |
            playwright-report/
            test-results/
