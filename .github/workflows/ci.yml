name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55421
      NEXT_PUBLIC_SUPABASE_ANON_KEY: mds-synthetic-anon-key
      MERCURIUS_BUILD_WORKERS: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint owned application code
        run: npm run lint

      - name: Scan tracked files for committed credentials
        run: npm run scan:secrets

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Build
        run: npm run build

      - name: Install accessibility browser
        run: npx playwright install --with-deps chromium

      - name: Component accessibility and keyboard tests
        run: npm run test:a11y

      - name: Keep browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-evidence
          path: |
            playwright-report/
            test-results/
