<!-- TRACE-105. Auth renders this for password recovery; tracked so the hosted template
     is entered from reviewed source. Wording is unchanged from the hosted template.

     The link points at our own site and carries {{ .TokenHash }}, which /set-password
     verifies in the browser that opens it. {{ .ConfirmationURL }} is not used: the Auth
     verify URL is spent (and the email confirmed) by any GET, including a mail scanner,
     and its PKCE code can only be exchanged in the browser that asked for the reset,
     so a link opened on another device showed "expired". -->
<h2>Reset your password</h2>

<p>We received a request to reset your password. Follow the link below to choose a new one.</p>
<p><a href="{{ .SiteURL }}/set-password?token_hash={{ .TokenHash }}&amp;type=recovery">Reset password</a></p>

<p>If you didn't request this, you can safely ignore this email.</p>
