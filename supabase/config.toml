# TRACE-071. Local mirror of the hosted provider-invitation settings; every other
# Auth setting keeps the CLI default. site_url is what the invitation template builds
# the recipient's link from, so it must be the site itself. The allowlist entry covers
# the redirect the handler still passes, which no reviewed template renders today.
[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/set-password?invitation=*"]

# DEC-2026-029 (owner, 2026-10-13; supersedes the 3-hour decision of 2026-09-13): the
# email link lasts 24 hours, the most hosted Auth allows (86400 s). Invitations default to
# 7 days. Keep in step with AUTH_INVITATION_LINK_HOURS and
# private.provider_invitation_link_lifetime().
[auth.email]
otp_expiry = 86400

[auth.email.template.invite]
subject = "Set up your Mercurius provider account"
content_path = "./supabase/templates/provider-invitation.html"

[auth.email.template.recovery]
subject = "Reset your password"
content_path = "./supabase/templates/password-recovery.html"

